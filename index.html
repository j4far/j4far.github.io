<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pogo Pop: Block Puzzle</title>
<style>
  :root { --bg: #241a5e; --card: #fffaf0; --ink: #2a1d6b; --green: #4fd14a; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 30%, #6b4cff, var(--bg) 70%); font-family: system-ui, sans-serif; color: var(--ink); padding: 16px; box-sizing: border-box; }
  .card { background: var(--card); border-radius: 28px; padding: 32px 24px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 10px 0 rgba(90,50,160,.5), 0 24px 50px rgba(0,0,0,.4); }
  img { width: 120px; height: 120px; border-radius: 26px; }
  h1 { margin: 16px 0 4px; font-size: 28px; }
  p { margin: 8px 0; line-height: 1.5; }
  a.btn { display: inline-block; margin-top: 14px; background: var(--green); color: #fff; text-decoration: none; font-weight: 700; padding: 12px 22px; border-radius: 16px; }
  small { display: block; margin-top: 18px; opacity: .7; }
</style>
</head>
<body>
  <div class="card">
    <img src="pogo-pop/icon.webp" alt="Pogo Pop icon" />
    <h1>Pogo Pop: Block Puzzle</h1>
    <p>Drag, drop and pop colourful blocks with Pogo the little dino across magical worlds full of mischievous minions and boss battles.</p>
    <a class="btn" href="pogo-pop/support.html">Support</a>
    <a class="btn" href="pogo-pop/privacy-policy.html">Privacy policy</a>
    <small>Contact: <a href="mailto:Development@mjsandyoungs.co.uk">Development@mjsandyoungs.co.uk</a></small>
  </div>
</body>
</html>
